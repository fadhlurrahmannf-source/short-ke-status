name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          set -e
          SRC=app/src/main/java/com/fedit/shortkestatus
          mkdir -p "$SRC" app/src/main/res/xml
          # move flat-uploaded files into the Android folder structure
          for f in MainActivity.kt VideoSplitter.kt; do
            if [ -f "$f" ]; then mv -f "$f" "$SRC/$f"; fi
          done
          if [ -f AndroidManifest.xml ]; then mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          test -f "$SRC/MainActivity.kt" || { echo "MainActivity.kt belum diupload"; exit 1; }
          test -f "$SRC/VideoSplitter.kt" || { echo "VideoSplitter.kt belum diupload"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "AndroidManifest.xml belum diupload"; exit 1; }

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="videos" path="videos/" />
          </paths>
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShortKeStatus"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fedit.shortkestatus"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fedit.shortkestatus"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.+")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          find . -path ./.git -prune -o -type f -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShortKeStatus-apk
          path: app/build/outputs/apk/debug/*.apk
